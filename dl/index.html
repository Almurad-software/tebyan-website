<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق تبيان - جارٍ التوجيه...</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
            direction: rtl;
        }
        .container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .logo-title {
            color: #070d1f;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .spinner {
            margin: 20px auto;
            width: 48px;
            height: 48px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #0f3ba2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status-text {
            color: #555555;
            font-size: 15px;
            line-height: 1.6;
        }
    </style>
    <script>
        window.onload = function() {
            // جلب أية كودات دعوة أو معاملات من الرابط (مثال: ?ref=123)
            var queryString = window.location.search; 

            // 1. رابط متجر جوجل بلاي (مظبوط بحزمتك com.almurad.tebyan)
            var googlePlayUrl = "https://play.google.com/store/apps/details?id=com.almurad.tebyan" + queryString;
            
            // 2. حالة النشر على App Store (تم إعدادها حالياً كـ false حتى تكتمل مراجعة أبل)
            // فور قبول ونشر التطبيق رسمياً على App Store، غير الكلمة من false إلى true
            var isIosPublished = false; 

            // رابط متجر أبل (بناءً على Apple ID: 6790076498)
            var appStoreUrl = isIosPublished 
                ? "https://apps.apple.com/app/id6790076498" + queryString
                : "https://tebyanapp.com/" + queryString;

            var userAgent = navigator.userAgent || navigator.vendor || window.opera;

            // تنفيذ التحويل التلقائي خلال نصف ثانية
            setTimeout(function() {
                if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                    // توجيه مستخدمي آيفون وآيباد
                    window.location.replace(appStoreUrl);
                } else {
                    // توجيه مستخدمي أندرويد وبقية الأجهزة
                    window.location.replace(googlePlayUrl);
                }
            }, 500);
        };
    </script>
</head>
<body>
    <div class="container">
        <div class="logo-title">تطبيق تبيان</div>
        <div class="spinner"></div>
        <p class="status-text">جارٍ تحويلك تلقائياً إلى المتجر المناسب لجهازك...</p>
    </div>
</body>
</html>
